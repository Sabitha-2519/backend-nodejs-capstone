name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install ESLint and Plugins
        run: |
          npm init -y
          npm install eslint eslint-config-standard eslint-plugin-import eslint-plugin-n eslint-plugin-promise

      - name: Run ESLint on Backend Files
        run: |
          find ./secondChance-backend -name "*.js" -exec ./node_modules/.bin/eslint -c .eslintrc.js {} +
          find ./sentiment -name "*.js" -exec ./node_modules/.bin/eslint -c .eslintrc.js {} +
          echo "Linting completed successfully!"
